<!DOCTYPE html>
<html>
<head>
  <!-- Google Fonts go here, OUTSIDE of <style> -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Comfortaa', sans-serif;
      margin: 20px;
      text-align: left; /* This ensures everything stays left-aligned */

    header {
      display: flex; /* This "pushes" items to be side-by-side */

      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px; /* Space between image and text */
    }
  </style>
</head>

<body>
  <header>
    <div class="logo-area">
      <img src="logo.png" width="30" alt="Logo"> 
      <span>Vertex <strong>Smart Pro</strong></span>
    </div>

    <div class="Info">
      <span>Made by <strong>Yaman</strong></span>
    </div>
  </header>

  <p>Hello! This is my first time trying <strong>HTML</strong>!</p>
  <p>Let me tell you how I started, what inspired me, and how I'm learning.</p>
  
  <h3>How I started</h3>
  <p>- I started just asking ChatGPT to generate code, but today I'm learning how to code myself!</p>

</body>
</html>
