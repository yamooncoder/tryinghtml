<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com" rel="stylesheet">
  <style>
    body { font-family: 'Comfortaa', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 400px; }
    h1 { color: #6c5ce7; margin-bottom: 10px; }
    p { color: #666; margin-bottom: 30px; }
    .version-link { 
      display: block; 
      background: #efecff; 
      color: #6c5ce7; 
      text-decoration: none; 
      padding: 15px; 
      margin: 10px 0; 
      border-radius: 10px; 
      font-weight: bold;
      transition: 0.3s;
    }
    .version-link:hover { background: #6c5ce7; color: white; transform: translateY(-3px); }
    .version-date { display: block; font-size: 0.8rem; font-weight: normal; opacity: 0.8; }
  </style>
</head>
<body>

  <div class="container">
    <h1>yamooncoder</h1>
    <p>Choose the version to view:</p>
    <div id="version-menu">
      <!-- Versions will appear here automatically -->
    </div>
  </div>

  <script>
    // Just add your new versions to this list!
    const myVersions = [
      { id: "1.0", date: "March 4, 2024", file: "v1.html" },
      { id: "1.1", date: "March 5, 2024", file: "v1_1.html" }
    ];

    const menu = document.getElementById('version-menu');
    myVersions.forEach(v => {
      const btn = document.createElement('a');
      btn.className = 'version-link';
      btn.href = v.file;
      btn.innerHTML = `Version ${v.id} <span class="version-date">${v.date}</span>`;
      menu.appendChild(btn);
    });
  </script>

</body>
</html>
